limit: 1000

memory_size: 8192

memory_mapped_io:

  0x80: ['h', '?', 'l', 'l', 'o', 0xA, 'h', 'e', 'l', 'l', 'o', 0xA]

  0x84: []

reports:

  - name: "Result"

    slice: last

    view: "Output decimal: {io:0x84:dec}"



  - name: "Execution trace"

    slice: all

    view: "{pc}: {instruction:next}"
